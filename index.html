<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyutai Live Transcription</title>
<style>
  /* Chalk marketing palette: green-1 ground, chartreuse primary, mint accents. */
  :root { --bg:#224A41; --panel:#1C3B34; --line:#32645B; --ink:#EFF5F3; --muted:#B9CFC7;
          --accent:#BBD96D; --mint:#70CD96; --rec:#F8947F; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:32px 16px; gap:20px; }
  html.embed body { padding:28px 24px; min-height:0; }
  html.embed h1, html.embed .sub { display:none; }
  h1 { font-size:22px; font-weight:500; margin:0; letter-spacing:-0.3px; }
  .sub { color:var(--muted); font-size:14px; margin-top:-12px; }
  .controls { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; }
  button { font:13px/15px ui-monospace,"SFMono-Regular",Menlo,monospace; text-transform:uppercase;
           letter-spacing:.06em; border:1px solid var(--accent); border-radius:20px; padding:12px 22px;
           cursor:pointer; background:var(--accent); color:var(--bg); min-width:170px;
           transition:background .15s,color .15s; }
  button:hover { background:transparent; color:var(--accent); }
  button.rec { background:var(--rec); border-color:var(--rec); color:var(--bg); }
  button.rec:hover { background:transparent; color:var(--rec); }
  button.ghost { background:transparent; color:var(--muted); border-color:var(--line); min-width:0; }
  button.ghost:hover { color:var(--ink); border-color:var(--muted); }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--muted); font:12px/18px ui-monospace,Menlo,monospace; text-transform:uppercase;
            letter-spacing:.06em; min-height:18px; }
  /* A tiny live waveform: one bar per recent audio chunk. */
  #meter { display:flex; align-items:center; gap:3px; height:32px; width:140px; }
  #meter > i { flex:1; height:2px; border-radius:1px; background:var(--mint); opacity:.35;
               transition:height 80ms linear, opacity 80ms linear; }
  #out { width:100%; max-width:760px; min-height:240px; max-height:60vh; overflow-y:auto;
         background:var(--panel); border:1px solid var(--line); border-radius:4px;
         padding:20px 24px; font-size:18px; }
  #out p { margin:0 0 12px; }
  #out p.live::after { content:"▍"; color:var(--mint); animation:blink 1s steps(1) infinite; }
  #out .placeholder { color:var(--muted); }
  @keyframes blink { 50% { opacity:0; } }
</style>
<script>
  if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");
</script>
</head>
<body>
  <h1>Kyutai streaming speech-to-text</h1>
  <div class="sub">kyutai/stt-1b-en_fr on a Chalk GPU scaling group · English &amp; French</div>
  <div class="controls">
    <button id="btn">Start talking</button>
    <div id="meter" aria-hidden="true"></div>
    <button id="clear" class="ghost">Clear</button>
  </div>
  <div id="status"></div>
  <div id="out"><p class="placeholder">Press “Start talking” and speak. Words appear about half a second behind you.</p></div>

<script>
const TARGET_RATE = 24000;      // Mimi's sample rate
const SEND_SAMPLES = 1920;      // one 80 ms model frame per WebSocket message

// Runs on the audio thread: downmixes, resamples the mic to 24 kHz, and posts Int16 chunks.
const WORKLET = `
class Pcm24k extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / ${TARGET_RATE};
    this.pos = 0;              // fractional read position into the carried input
    this.carry = new Float32Array(0);
    this.out = new Int16Array(${SEND_SAMPLES});
    this.n = 0;
  }
  process(inputs) {
    const ch = inputs[0];
    if (!ch || !ch[0]) return true;
    const len = ch[0].length;
    const buf = new Float32Array(this.carry.length + len);
    buf.set(this.carry);
    for (let i = 0; i < len; i++) {
      let s = 0;
      for (let c = 0; c < ch.length; c++) s += ch[c][i];
      buf[this.carry.length + i] = s / ch.length;
    }
    let peak = 0;
    while (this.pos + 1 < buf.length) {
      const i = Math.floor(this.pos), f = this.pos - i;
      const v = Math.max(-1, Math.min(1, buf[i] * (1 - f) + buf[i + 1] * f));
      peak = Math.max(peak, Math.abs(v));
      this.out[this.n++] = v < 0 ? v * 0x8000 : v * 0x7fff;
      if (this.n === this.out.length) {
        this.port.postMessage(this.out.buffer.slice(0));
        this.n = 0;
      }
      this.pos += this.ratio;
    }
    const keep = Math.floor(this.pos);
    this.carry = buf.slice(keep);
    this.pos -= keep;
    this.port.postMessage({ peak });
    return true;
  }
}
registerProcessor("pcm-24k", Pcm24k);
`;

const btn = document.getElementById("btn");
const statusEl = document.getElementById("status");
const out = document.getElementById("out");
const meterEl = document.getElementById("meter");
const METER_BARS = 24;
for (let i = 0; i < METER_BARS; i++) meterEl.appendChild(document.createElement("i"));
const meterBars = Array.from(meterEl.children);
const peaks = new Array(METER_BARS).fill(0);
function pushPeak(p) {
  peaks.shift();
  peaks.push(p);
  meterBars.forEach((bar, i) => {
    const v = Math.min(1, peaks[i] * 2.5);
    bar.style.height = Math.max(2, v * 32) + "px";
    bar.style.opacity = 0.35 + 0.65 * v;
  });
}
// The worklet reports a peak every ~3 ms; fold them into one bar per 50 ms.
let pendingPeak = 0, lastBarAt = 0;
function notePeak(p) {
  pendingPeak = Math.max(pendingPeak, p);
  const now = performance.now();
  if (now - lastBarAt >= 50) { pushPeak(pendingPeak); pendingPeak = 0; lastBarAt = now; }
}
function resetMeter() { peaks.fill(0); pendingPeak = 0; pushPeak(0); }
let session = null;   // { ws, ctx, stream, node }
let para = null;      // the <p> currently receiving words

function setStatus(s) { statusEl.textContent = s; }

function newParagraph() {
  if (para) para.classList.remove("live");
  out.querySelector(".placeholder")?.remove();
  para = document.createElement("p");
  para.className = "live";
  out.appendChild(para);
}

function addWord(text) {
  if (!para) newParagraph();
  // The first piece of a paragraph carries the word-boundary space; drop it.
  para.textContent += para.textContent ? text : text.trimStart();
  out.scrollTop = out.scrollHeight;
}

function wsUrl() {
  const u = new URL("ws", location.href);
  u.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  return u.toString();
}

async function start() {
  btn.disabled = true;
  setStatus("Requesting microphone…");
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    setStatus("Microphone unavailable: " + e.message);
    btn.disabled = false;
    return;
  }

  setStatus("Connecting to the GPU…");
  const ws = new WebSocket(wsUrl());
  ws.binaryType = "arraybuffer";
  const ctx = new AudioContext();
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, "pcm-24k");
  // The worklet writes no output, so this plays silence; it keeps the graph pulling audio.
  node.connect(ctx.destination);
  session = { ws, ctx, stream, node, ready: false };

  node.port.onmessage = (ev) => {
    if (ev.data instanceof ArrayBuffer) {
      if (session?.ready && ws.readyState === WebSocket.OPEN) ws.send(ev.data);
    } else {
      notePeak(ev.data.peak);
    }
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "ready") {
      session.ready = true;
      src.connect(node);
      newParagraph();
      btn.textContent = "Stop";
      btn.classList.add("rec");
      btn.disabled = false;
      setStatus("Listening");
    } else if (msg.type === "busy") {
      setStatus("Someone else is using the model right now. Try again in a moment.");
    } else if (msg.type === "word") {
      addWord(msg.text);
    } else if (msg.type === "end_of_turn") {
      if (para && para.textContent) newParagraph();
    } else if (msg.type === "done") {
      setStatus("Done");
    }
  };
  ws.onclose = () => teardown();
  ws.onerror = () => setStatus("Connection error");
}

function stop() {
  if (!session) return;
  btn.disabled = true;
  setStatus("Finishing the last words…");
  session.node.disconnect();
  session.stream.getTracks().forEach((t) => t.stop());
  resetMeter();
  // The server flushes the model's delay with silence, sends "done", then closes.
  if (session.ws.readyState === WebSocket.OPEN) session.ws.send(JSON.stringify({ type: "end" }));
  else teardown();
}

function teardown() {
  if (!session) return;
  const s = session;
  session = null;
  s.stream.getTracks().forEach((t) => t.stop());
  s.ctx.close();
  if (para) { para.classList.remove("live"); if (!para.textContent) para.remove(); para = null; }
  resetMeter();
  btn.textContent = "Start talking";
  btn.classList.remove("rec");
  btn.disabled = false;
  if (statusEl.textContent !== "Done" && !statusEl.textContent.startsWith("Someone")) setStatus("Disconnected");
}

btn.onclick = () => (session ? stop() : start());
document.getElementById("clear").onclick = () => { out.innerHTML = ""; para = null; if (session?.ready) newParagraph(); };
</script>
</body>
</html>
